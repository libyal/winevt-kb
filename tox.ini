[tox]
envlist = py3{10,11,12,13,14,15},black,coverage,docformatter,docs,pylint,wheel

[testenv]
download = True
pip_pre = True
passenv =
  CFLAGS
  CPPFLAGS
  LDFLAGS
setenv =
  PYTHONPATH = {toxinidir}
deps =
  coverage: coverage
  wheel:
    build
    setuptools >= 77
    wheel
commands =
  py3{10,11,12,13,14,15}: python run_tests.py
  coverage: coverage erase
  coverage: coverage run --source=winevtrc --omit="*_test*,*__init__*,*test_lib*" run_tests.py
  coverage: coverage xml
  wheel: python -m build --no-isolation --wheel

[testenv:black]
skipsdist = True
pip_pre = True
passenv =
  CFLAGS
  CPPFLAGS
  LDFLAGS
setenv =
  PYTHONPATH = {toxinidir}
deps =
  black
  setuptools >= 77
commands =
  black --version
  black .

[testenv:docformatter]
skipsdist = True
pip_pre = True
passenv =
  CFLAGS
  CPPFLAGS
  LDFLAGS
setenv =
  PYTHONPATH = {toxinidir}
deps =
  docformatter
  setuptools >= 77
commands =
  docformatter --version
  docformatter --in-place --recursive tests winevtrc

[testenv:docs]
usedevelop = True
deps =
  -rdocs/requirements.txt
commands =
  sphinx-build -b html -d build/doctrees docs dist/docs
  sphinx-build -b linkcheck docs dist/docs

[testenv:pylint]
skipsdist = True
pip_pre = True
passenv =
  CFLAGS
  CPPFLAGS
  LDFLAGS
setenv =
  PYTHONPATH = {toxinidir}
deps =
  pylint >= 4.0.0, < 4.1.0
  setuptools >= 65
commands =
  pylint --version
  pylint --rcfile=.pylintrc tests winevtrc
